services:
  db:
    image: postgres:16-alpine
    container_name: guitarshop-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: guitar_shop
      REPLICATION_USER: replicator
      REPLICATION_PASSWORD: replicatorpass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/db/01-primary-init.sh:/docker-entrypoint-initdb.d/01-primary-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d guitar_shop"]
      interval: 5s
      timeout: 3s
      retries: 20

  db_espejo:
    image: postgres:16-alpine
    container_name: guitarshop-db-espejo
    depends_on:
      db:
        condition: service_healthy
    environment:
      REPLICATION_USER: replicator
      REPLICATION_PASSWORD: replicatorpass
    ports:
      - "5434:5432"
    volumes:
      - pgdata_replica:/var/lib/postgresql/data
      - ./docker/db/replica-entrypoint.sh:/replica-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/replica-entrypoint.sh"]

  db_backup:
    image: postgres:16-alpine
    container_name: guitarshop-db-backup
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: postgres
    volumes:
      - db_backups:/backups
    entrypoint: >
      sh -c "
      echo 'Starting backups every 6 hours to /backups ...';
      while true; do
        pg_dump -h db -U postgres -d guitar_shop > /backups/guitar_shop_$(date +%Y%m%d_%H%M%S).sql;
        sleep 21600;
      done
      "

  db_archivo:
    image: postgres:16-alpine
    container_name: guitarshop-db-archivo
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: guitarshop_archivo
    ports:
      - "5433:5432"
    volumes:
      - pgdata_archivo:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d guitarshop_archivo"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./guitarshop-backend
      dockerfile: Dockerfile
    container_name: guitarshop-backend
    env_file:
      - ./guitarshop-backend/.env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@db:5432/guitar_shop?schema=public
      PORT: "3000"
    ports:
      - "3000:3000"
      - "5555:5555"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./guitarshop-backend:/app
      - backend_node_modules:/app/node_modules

  frontend:
    build:
      context: ./react-frontend
      dockerfile: Dockerfile
    container_name: guitarshop-frontend
    env_file:
      - ./react-frontend/.env
    environment:
      VITE_BACKEND_URL: http://localhost:3000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./react-frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  pgdata:
  pgdata_replica:
  db_backups:
  pgdata_archivo:
  backend_node_modules:
  frontend_node_modules:
